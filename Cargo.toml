stacker = "0.1.25"
starlark = { version = "0.14.2", path = "starlark" }
starlark_derive = { version = "0.14.2", path = "starlark_derive" }
starlark_lsp = { version = "0.14.2", path = "starlark_lsp" }
starlark_map = { version = "0.14.2", path = "starlark_map", features = ["pagable_dep"] }
starlark_syntax = { version = "0.14.2", path = "starlark_syntax" }
static_assertions = "1.1.0"
strong_hash = { version = "0.1.0", git = "https://github.com/facebook/buck2.git", branch = "main" }
