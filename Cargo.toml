globset = { version = "0.4.20", features = ["serde1"] }
hashbrown = "0.17.1"
indexmap = { version = "2.14.0", features = ["arbitrary", "rayon", "serde"] }
inventory = "0.3.24"
itertools = "0.15.0"
logos = "0.16.1"
lsp-server = "0.10.0"
